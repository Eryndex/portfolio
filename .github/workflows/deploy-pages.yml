name: Deploy ERYNDEX website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/eryndex-company-website/**"
      - "projects/routepilot/**"
      - "projects/signaldesk/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static website
        run: |
          mkdir -p dist/routepilot dist/signaldesk
          cp -a projects/eryndex-company-website/. dist/
          cp -a projects/routepilot/. dist/routepilot/
          cp -a projects/signaldesk/. dist/signaldesk/
          printf 'eryndex.net\n' > dist/CNAME
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
